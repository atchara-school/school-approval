<title>ระบบเสนอเอกสารและลงนามออนไลน์</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

<style>
:root{--bg:#f4f6f5;--card:#fff;--tx:#1b2a27;--mut:#62706c;--line:#dde3e0;--pri:#0f6b5c;--bad:#b42318;--warn:#b54708}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2321;--tx:#e6eeeb;--mut:#9aaaa5;--line:#2a3633;--pri:#4fc3ad;--bad:#ff8d82;--warn:#ffb36b}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Sarabun,"Noto Sans Thai",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:14px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:19px;margin:0}h2{font-size:17px;margin:18px 0 8px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:7px 14px;border-radius:999px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:var(--bg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px}
label{display:block;font-size:14px;color:var(--mut);margin:9px 0 3px}
input,select,textarea{width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--tx);font:inherit}
.btn{border:0;background:var(--pri);color:var(--bg);padding:8px 15px;border-radius:7px;font:inherit;cursor:pointer;margin-top:9px;margin-right:6px}
.btn.bad{background:var(--bad);color:#fff}.btn.ghost{background:none;color:var(--pri);border:1px solid var(--line)}
.mut{color:var(--mut);font-size:14px}.tag{font-size:13px;padding:1px 9px;border-radius:999px;border:1px solid var(--line)}
.msg{padding:8px 10px;border-radius:7px;background:var(--card);border:1px solid var(--warn);color:var(--warn);margin-bottom:10px}
.hist{border-left:3px solid var(--line);padding-left:10px;margin:6px 0;font-size:14px}
canvas{width:100%;height:130px;border:1px dashed var(--line);border-radius:8px;background:#fff;touch-action:none}
a{color:var(--pri)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
</style>
</head>

/* วาดหน้าบันทึกข้อความ (A4) เป็นภาพ — ภาษาไทยแสดงถูกต้องเพราะใช้ฟอนต์ของเบราว์เซอร์ */
async function renderCover(c){
  await document.fonts.load('36px Sarabun');await document.fonts.load('600 36px Sarabun');
  const W=1240,H=1754,LM=150,RM=1090,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#000';x.textBaseline='alphabetic';
  const seg=new Intl.Segmenter('th',{granularity:'word'});

  // เขียนข้อความหลายช่วง (ตัวหนา/ขีดเส้นใต้) พร้อมตัดบรรทัด; ind = ย่อหน้าบรรทัดแรก
  function para(segs,y,{px=36,lh=52,ind=0,left=LM,right=RM}={}){
    let cx=left+ind;
    for(const sg of segs)for(const w of seg.segment(sg.t)){
      font(sg.b,px);const t=w.segment,wd=x.measureText(t).width;
      if(cx+wd>right&&t.trim()){cx=left;y+=lh}
      if(cx===left&&!t.trim())continue;
      x.fillText(t,cx,y);
      if(sg.u){x.fillRect(cx,y+6,wd,2)}
      cx+=wd}
    return y+lh}
  const img=async u=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=u});
  const emb=await img(EMBLEM);x.drawImage(emb,LM,95,120,126);
  font(1,54);x.textAlign='center';x.fillText('บันทึกข้อความ',W/2,180);x.textAlign='left';
  let y=275;
  y=para([{t:'ส่วนราชการ',b:1},{t:'   '+SCHOOL}],y,{ind:30});
  y=para([{t:'ที่',b:1},{t:'  '+(c.no||'..............................')+'          '},{t:'วันที่',b:1},{t:'  '+c.date}],y);
  y=para([{t:'เรื่อง',b:1},{t:'   '+c.subject}],y);
  x.fillRect(LM,y-34,RM-LM,2);y+=14;
  y=para([{t:'เรียน',b:1},{t:'   '+TO_LINE}],y);
  y+=8;
  let body;
  if(c.memo)body=[{t:'ด้วยข้าพเจ้า '+c.teacher.name+' ขอเสนอ '},{t:c.title,u:1},{t:' เพื่อโปรดพิจารณาลงนาม ดังเอกสารแนบท้ายนี้'}];
  else body=[{t:'ด้วยข้าพเจ้า '+c.teacher.name+' ได้รับมอบหมายให้จัดการเรียนการสอนตามหลักสูตรสถานศึกษา สำหรับภาคเรียนที่ '+SEMESTER+' จึงขอนำส่งงาน '},{t:c.catName.replace(/^งาน/,''),u:1},{t:' ได้แก่ '},{t:c.title,u:1},{t:' ดังเอกสารแนบท้ายนี้'}];
  y=para(body,y,{ind:100});
  y=para([{t:c.memo?'จึงเรียนมาเพื่อโปรดพิจารณา':'จึงเรียนมาเพื่อโปรดทราบ'}],y+8,{ind:100});
  // ลายเซ็นครู
  const tx=560;font(0,36);x.fillText('ลงชื่อ',tx,y+80);
  if(c.teacher.sig){const si=await img(c.teacher.sig);const r=Math.min(300/si.width,90/si.height);x.drawImage(si,tx+90+(320-si.width*r)/2,y+80-si.height*r-2,si.width*r,si.height*r)}
  x.fillRect(tx+90,y+84,320,0);x.setLineDash([3,5]);x.beginPath();x.moveTo(tx+90,y+82);x.lineTo(tx+420,y+82);x.stroke();x.setLineDash([]);
  x.textAlign='center';font(0,36);x.fillText('('+c.teacher.name+')',tx+255,y+130);x.textAlign='left';
  y+=165;
  // ช่องความเห็น
  async function box(bx,by,bw,bh,[key,title,pos]){
    x.strokeStyle='#000';x.lineWidth=2;x.strokeRect(bx,by,bw,bh);
    x.textAlign='center';font(1,34);x.fillText(title,bx+bw/2,by+42);x.fillRect(bx,by+58,bw,2);x.textAlign='left';
    const b=(c.boxes||{})[key];
    if(!b){font(0,30);x.fillStyle='#777';x.fillText('...........................................................',bx+16,by+105);x.fillText('(..............................)  '+pos+' ........',bx+16,bh-22+by);x.fillStyle='#000';return}
    let yy=para([{t:'- '+b.comment}],by+104,{px:30,lh:38,left:bx+16,right:bx+bw-16});
    const si=await img(b.sig);const r=Math.min((bw*0.5)/si.width,70/si.height);
    x.drawImage(si,bx+bw/2-si.width*r/2,by+bh-178,si.width*r,si.height*r);
    x.textAlign='center';font(0,30);x.fillText('('+b.name+')',bx+bw/2,by+bh-96);
    x.fillText(pos+(b.dept?' '+b.dept:''),bx+bw/2,by+bh-58);x.fillText('วันที่ '+b.date,bx+bw/2,by+bh-20);x.textAlign='left'}
  const hw=(RM-LM)/2;
  await box(LM,y,hw,330,BOXES[0]);await box(LM+hw,y,hw,330,BOXES[1]);await box(LM,y+330,RM-LM,300,BOXES[2]);
  return cv.toDataURL('image/png');
}
/* รวมหน้าปก + ไฟล์ PDF ต้นฉบับของครู แล้วอัปโหลดเป็นเวอร์ชันใหม่ */
async function compose(c,id,buf){
  const out=await PDFLib.PDFDocument.create();
  const pg=out.addPage([595.28,841.89]);pg.drawImage(await out.embedPng(await renderCover(c)),{x:0,y:0,width:595.28,height:841.89});
  if(!buf){const {data,error}=await sb.storage.from('docs').download(c.orig);if(error)throw new Error('ดาวน์โหลดไฟล์ต้นฉบับไม่สำเร็จ');buf=await data.arrayBuffer()}
  const src=await PDFLib.PDFDocument.load(buf,{ignoreEncryption:true});
  (await out.copyPages(src,src.getPageIndices())).forEach(p=>out.addPage(p));
  const path=`${id}/${Date.now()}.pdf`;
  const up=await sb.storage.from('docs').upload(path,new Blob([await out.save()],{type:'application/pdf'}));if(up.error)throw up.error;
  return path}
function cropSig(canvas){ // ตัดขอบว่างของลายเซ็นออก
  const x=canvas.getContext('2d'),d=x.getImageData(0,0,canvas.width,canvas.height).data;let x0=1e9,y0=1e9,x1=0,y1=0;
  for(let i=0;i<d.length;i+=4)if(d[i+3]>20){const p=i/4,px=p%canvas.width,py=(p/canvas.width)|0;x0=Math.min(x0,px);x1=Math.max(x1,px);y0=Math.min(y0,py);y1=Math.max(y1,py)}
  if(x1<=x0)throw new Error('กรุณาวาดลายเซ็นก่อน');
  const m=10,w=x1-x0+2*m,h=y1-y0+2*m,o=document.createElement('canvas');o.width=w;o.height=h;o.getContext('2d').drawImage(canvas,x0-m,y0-m,w,h,0,0,w,h);return o.toDataURL('image/png')}
async function rpc(sub,kind,to,comment,path,cover){const {error}=await sb.rpc('act',{p_sub:sub,p_kind:kind,p_to:to||null,p_comment:comment||null,p_path:path||null,p_cover:cover||null});if(error)throw error}

/* ----- events ----- */
document.addEventListener('focusin',e=>typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName));
document.addEventListener('focusout',()=>{typing=false;if(pend){pend=false;setTimeout(render,50)}});
document.addEventListener('change',async e=>{
  if(e.target.dataset.a==='chg')fillSend();
  if(e.target.dataset.u){const f=e.target.dataset.f;const {error}=await sb.from('profiles').update({[f]:e.target.value}).eq('id',e.target.dataset.u);msg=error?error.message:'';await loadAll();if(f==='role')render()}
});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;e.preventDefault();
  const a=b.dataset.a,v=b.dataset.v;msg='';
  try{
    if(a==='login'||a==='signup'){
      const em=$('#em').value.trim(),pw=$('#pw').value,fn=$('#fn').value.trim();
      if(!em||!pw)throw new Error('กรุณากรอกอีเมลและรหัสผ่าน');
      if(a==='signup'&&!fn)throw new Error('กรุณากรอกชื่อ-สกุล');
      if(a==='signup'&&pw.length<6)throw new Error('รหัสผ่านต้องยาวอย่างน้อย 6 ตัวอักษร');
      const r=a==='login'?await sb.auth.signInWithPassword({email:em,password:pw}):await sb.auth.signUp({email:em,password:pw,options:{data:{full_name:fn}}});
      if(r.error)throw r.error;if(a==='signup'&&!r.data.session){msg='สมัครแล้ว กรุณายืนยันอีเมลก่อนเข้าสู่ระบบ';return loginView()}
      return boot()}
    if(a==='out'){await sb.auth.signOut();if(chan)sb.removeChannel(chan);me=null;return loginView()}
    if(a==='tab'){tab=v;sel=null}
    else if(a==='open'){sel=v}
    else if(a==='back'){sel=null}
    else if(a==='nopen'){const n=N.find(x=>x.id===v);await sb.from('notifications').update({read:true}).eq('id',v);sel=n.submission_id;await loadAll()}
    else if(a==='view'){const {data,error}=await sb.storage.from('docs').createSignedUrl(v,300);if(error)throw error;window.open(data.signedUrl,'_blank');return}
    else if(a==='clr'){pad.clearRect(0,0,9999,9999);return}
    else if(a==='savesig'){const {error}=await sb.from('signatures').upsert({user_id:me.id,img:cropSig($('#pad'))});if(error)throw error;msg='บันทึกลายเซ็นแล้ว'}
    else if(a==='addt'){const t=$('#tt').value.trim();if(!t)throw new Error('กรุณาใส่ชื่องาน');const {error}=await sb.from('task_defs').insert({category_id:+$('#tc').value,title:t,due_date:$('#td').value||null});if(error)throw error;await loadAll()}
    else if(a==='tgl'){const t=T.find(x=>x.id===v);await sb.from('task_defs').update({active:!t.active}).eq('id',v);await loadAll()}
    else if(a==='send'){
      const f=$('#sfile').files[0],td=$('#std')&&$('#std').value,tdr=T.find(t=>t.id===td),title=$('#st').value.trim()||(tdr&&tdr.title)||'';
      if(!f||!title)throw new Error('กรุณาใส่ชื่อเอกสาร (หรือเลือกงานที่กำหนด) และเลือกไฟล์ PDF');if(f.type!=='application/pdf')throw new Error('รองรับเฉพาะไฟล์ PDF');
      const sig=await mySig();
      busy=true;render();const id=crypto.randomUUID(),cat0=C.find(c=>c.id==$('#sc').value);
      const orig=`${id}/orig.pdf`;
      const up=await sb.storage.from('docs').upload(orig,f);if(up.error)throw up.error;
      const cover={no:$('#sno').value.trim(),date:today(),title,subject:(cat0.is_memo?'ขอเสนอ':'ขอนำส่ง')+title,catName:cat0.name,memo:cat0.is_memo,teacher:{name:me.full_name,sig},boxes:{},orig};
      const path=await compose(cover,id,await f.arrayBuffer());
      const ins=await sb.from('submissions').insert({id,category_id:cat0.id,task_def_id:td||null,title,file_path:path,status:'draft',holder:me.id});if(ins.error)throw ins.error;
      await rpc(id,'forward',$('#sto').value,$('#scm').value,path,cover);busy=false;await loadAll();tab='mine';msg='ส่งเอกสารแล้ว (สร้างบันทึกข้อความหน้าแรกให้เรียบร้อย)'}
    else if(['fwd','ret','approve'].includes(a)){
      const s=S.find(x=>x.id===sel),cm=$('#cm').value.trim();let path=null,cover=null,buf=null;busy=true;render();
      if(a==='ret'){if(!cm)throw new Error('กรุณาเขียนเหตุผลที่ส่งคืน');await rpc(s.id,'return',$('#bk').value,cm)}
      else{
        cover=JSON.parse(JSON.stringify(s.cover||{}));
        if(me.role==='teacher'){
          const f=$('#nf')&&$('#nf').files[0];
          if(f){const o=`${s.id}/orig-${Date.now()}.pdf`;const up=await sb.storage.from('docs').upload(o,f);if(up.error)throw up.error;cover.orig=o;buf=await f.arrayBuffer()}
          cover.teacher.sig=await mySig();cover.teacher.name=me.full_name;cover.date=today();cover.boxes={};
        }else{
          if(!cm)throw new Error('กรุณาเขียนความเห็นก่อนลงนาม');
          cover.boxes=cover.boxes||{};cover.boxes[me.role]={comment:cm,name:me.full_name,dept:me.department||'',date:today(),sig:await mySig()};
        }
        path=await compose(cover,s.id,buf);
        await rpc(s.id,a==='approve'?'approve':'forward',a==='fwd'?$('#to').value:null,cm,path,cover)}
      busy=false;sel=null;await loadAll();msg='ดำเนินการเรียบร้อย'}
  }catch(err){busy=false;msg=th(err.message||String(err))}
  if(!me)return loginView();
  render();if(tab==='send'&&!sel)fillSend();
});
const _r=render;render=function(){_r();if(tab==='send'&&!sel&&$('#sc')&&!$('#sto').options.length)fillSend()};
boot().catch(e=>{$('#app').textContent='เริ่มระบบไม่สำเร็จ: '+e.message});
</script>
